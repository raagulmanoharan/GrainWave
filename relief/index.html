<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21101b"><title>Relief — light into melody</title><link rel="stylesheet" href="style.css"></head><body data-mode="camera"><main><section class="stage" aria-label="Live dithered camera. Drag vertically to adjust threshold, tap to capture"><canvas id="cloud" tabindex="0" role="button" aria-label="Tap to capture a photograph; use up and down arrow keys to change threshold"></canvas><div class="stage-top"><span>relief / light into melody</span><span id="live-state">CAMERA</span></div><div class="threshold-indicator"><span>threshold</span><output id="threshold-out">50%</output><div class="meter"><i id="threshold-meter"></i></div></div><div class="visual-instruction" id="visual-instruction">drag to find the texture<br><em>tap to keep it.</em></div><p id="status" role="status" aria-live="polite">Opening your camera…</p><div id="note-readout" aria-live="off"></div></section><section class="instrument-controls" aria-label="Instrument controls"><div class="control-top"><span id="control-title">Find a little rhythm in the everyday.</span><span>7 · 11 · 16</span></div><div class="actions"><button id="camera">Enable camera <span>→</span></button><button id="upload">Choose a photo <span>＋</span></button><button id="retake" hidden>Take another <span>→</span></button><button id="play" disabled>Play melody <span>→</span></button></div><div class="controls"><label>TEMPO<div class="value-row"><input id="tempo" type="range" min="50" max="180" value="104"><output id="tempo-out">104 BPM</output></div></label><label>SCALE<select id="scale"><option value="minor">A / NATURAL MINOR</option><option value="pentatonic">A / PENTATONIC</option><option value="dorian">A / DORIAN</option><option value="major">A / MAJOR</option></select></label></div></section></main><video id="feed" autoplay muted playsinline hidden></video><input id="photo-input" type="file" accept="image/*" hidden><script type="module" src="app.js"></script></body></html>
