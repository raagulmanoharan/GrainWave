name: OpenCV browser checks
on:
  push:
    branches: [main, opencv-cleanup, region-grain, motion-tone, fine-mosaic, loop-echo, expressive-tones]
    paths: ['relief/**', '.github/workflows/opencv-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: for file in relief/*.js; do node --check "$file" || exit 1; done
      - run: node relief/tests/expression.mjs
      - run: node relief/tests/note-echo.mjs
      - run: node relief/tests/tone-expression.mjs
      - run: node relief/tests/opencv-browser.mjs
